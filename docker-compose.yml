services:
  postgres:
    image: postgres:15-alpine
    container_name: tontine_postgres
    restart: always
    environment:
      POSTGRES_USER: tontine_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: tontine_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tontine_user -d tontine_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tontine_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tontine_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://tontine_user:secretpassword@postgres:5432/tontine_db
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_NAME: ${ADMIN_NAME:?Set ADMIN_NAME in .env}
      ADMIN_PHONE: ${ADMIN_PHONE:?Set ADMIN_PHONE in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: